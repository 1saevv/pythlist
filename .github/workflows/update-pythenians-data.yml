name: Update Pythenians data

on:
  workflow_dispatch:
    inputs:
      full_collection:
        description: "Build the full collection dataset"
        required: true
        default: true
        type: boolean
      numbers:
        description: "Comma-separated Pythenian numbers for a PoC run"
        required: true
        default: "3574,786,2446,3360,1270"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore private build cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: pythenians-state-${{ github.run_id }}
          restore-keys: |
            pythenians-state-

      - name: Install dependencies
        run: npm ci

      - name: Check RPC secret
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo "SOLANA_RPC_URL GitHub Secret is required."
            exit 1
          fi

      - name: Build Pythenians dataset
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          RPC_THROTTLE_MS: "250"
          HISTORY_PAGE_LIMIT: "20"
          TRANSACTION_BATCH_SIZE: "100"
          TRANSFER_FALLBACK: "true"
          PYTHENIANS_IMAGE_SIZE: "560"
          PYTHENIANS_IMAGE_QUALITY: "82"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_collection }}" != "true" ]; then
            node scripts/build-pythenians-dataset.mjs --numbers="${{ inputs.numbers }}" --out=data/pythenians.poc.json
          else
            npm run pythenians:build
          fi

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data package-lock.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git commit -m "Update Pythenians dataset"
          git push
